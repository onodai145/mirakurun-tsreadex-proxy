name: Release

# v* タグの push で、GHCR にマルチアーキテクチャのイメージを公開する。
# アーキテクチャごとにネイティブのランナーでビルドして digest で push し、
# 最後にマニフェストリストへまとめる(QEMU でのエミュレーションを避けるため)。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/onodai145/tsreadex-proxy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -race

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # digest だけで push する。タグはマニフェストリストにだけ付ける。
          # provenance / SBOM のアテステーションは、マニフェストリストへまとめる際に
          # 失われるため付けない。
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: digest を保存する
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # v1.2.3 のタグから 1.2.3、1.2、latest を作る(先頭の v は付けない)。
          # プレリリース(v1.2.3-rc.1)には latest も 1.2 も付かない。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: マニフェストリストを作って push する
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest_refs=()
          for digest in *; do
            digest_refs+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_refs[@]}"
      - name: 公開されたイメージを確認する
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}"

  # イメージの公開に成功したあとで、GitHub のリリースページを作る。
  # contents: write が必要なのはこのジョブだけ。
  github-release:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リリースを作る
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # v1.2.3-rc.1 のようにハイフンを含むタグはプレリリースにする。
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
